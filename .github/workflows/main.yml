name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o text_os_demo.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android files
        working-directory: text_os_demo
        run: flutter create --platforms=android .

      - name: Get dependencies
        working-directory: text_os_demo
        run: flutter pub get

      - name: Build APK
        working-directory: text_os_demo
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: text-os-demo-apk
          path: text_os_demo/build/app/outputs/flutter-apk/app-debug.apk
